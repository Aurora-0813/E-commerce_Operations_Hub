# Alembic configuration
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on Chinese Windows), so non-ASCII comments would crash it.
[alembic]
script_location = alembic
prepend_sys_path = .
# DB URL is set in env.py from Settings (.env), leave empty here
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
